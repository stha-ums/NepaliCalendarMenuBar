name: Release (GitHub)

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Proprietary Dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
        run: ./scripts/setup-dependencies.sh

      - name: Setup Secrets.xcconfig
        run: |
          echo "TELEMETRY_APP_ID = ${{ secrets.TELEMETRY_APP_ID }}" > Secrets.xcconfig
          echo "SENTRY_DSN = ${{ secrets.SENTRY_DSN }}" >> Secrets.xcconfig
          echo "SENTRY_ORG = ${{ secrets.SENTRY_ORG }}" >> Secrets.xcconfig
          echo "SENTRY_PROJECT = ${{ secrets.SENTRY_PROJECT }}" >> Secrets.xcconfig

      - name: Setup Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Setup App Store Connect API Key
        run: |
          jq -n \
            --arg key_id "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}" \
            --arg issuer_id "${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}" \
            --arg key "${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}" \
            '{key_id: $key_id, issuer_id: $issuer_id, key: $key}' \
            > app_store_connect_api_key.json

      - name: Setup Keychain
        run: |
          # Create a temporary keychain
          security create-keychain -p actions temp.keychain
          security default-keychain -s temp.keychain
          security unlock-keychain -p actions temp.keychain
          security set-keychain-settings -t 3600 -u temp.keychain

      - name: Install Sparkle Tools
        run: |
          DOWNLOAD_URL=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/sparkle-project/Sparkle/releases/latest | jq -r '.assets[] | select(.name | endswith(".tar.xz")) | .browser_download_url')
          curl -L -o Sparkle.tar.xz "$DOWNLOAD_URL"
          mkdir sparkle-tools
          tar -xf Sparkle.tar.xz -C sparkle-tools
          # Add the bin directory to GITHUB_PATH
          echo "$(pwd)/sparkle-tools/bin" >> $GITHUB_PATH

      - name: Build and Notarize
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
          TELEMETRY_APP_ID: ${{ secrets.TELEMETRY_APP_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          # Generate MATCH_GIT_BASIC_AUTHORIZATION from PAT
          export MATCH_GIT_BASIC_AUTHORIZATION=$(echo -n "stha-ums:${{ secrets.PAT }}" | base64)
          
          bundle exec fastlane build_github

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            "output/BS Calendar (Bikram Sambat).dmg"
            output/appcast.xml
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
